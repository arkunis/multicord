services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: multicord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multicord-local-dev}
      POSTGRES_DB: multicord
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - multicord-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multicord"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  multicord-postgres:
